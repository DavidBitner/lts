<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formatação de Alertas</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="topbar">
      <a class="back-home-btn" href="../../" aria-label="Voltar ao início">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 5l-7 7 7 7"
          />
        </svg>
        <span>Início</span>
      </a>
      <h1 class="topbar-title">Formatação de Alertas</h1>
    </header>

    <main class="form-container">
      <section class="card" id="sec-editor">
        <header class="card-head"><h3>Texto do alerta</h3></header>
        <div id="editor"></div>
      </section>

      <div class="action-bar">
        <div class="action-bar-inner">
          <button class="button" id="copy">
            <span class="shadow"></span><span class="edge"></span>
            <div class="front"><span>COPIAR TEXTO FORMATADO</span></div>
          </button>
        </div>
      </div>
    </main>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script defer src="./app.js"></script>
  </body>
</html>
