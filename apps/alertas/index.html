<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formatação de Alertas</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="topbar">
      <a class="back-home-btn" href="../../" aria-label="Voltar ao início">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 2l2.6 2.7L17 2l2 5.6V14l-3.8-1.6L12 20l-3.2-7.6L5 14V7.6L7 2l2.4 2.7L12 2z"
          />
          <path
            fill="currentColor"
            d="M8.4 9.8L6 12.4l3.3-.4L9 11c.3-.7-.1-1.5-.6-1.2zM15.6 9.8l.3 1.2 3.1.4-2.4-2.6c-.6-.3-1 .5-.6 1z"
          />
        </svg>
      </a>
      <h1 class="topbar-title">Formatação de Alertas</h1>
    </header>

    <main class="form-container">
      <section class="card" id="sec-editor">
        <header class="card-head"><h3>Texto do alerta</h3></header>
        <div id="editor"></div>
      </section>

      <div class="action-bar">
        <div class="action-bar-inner">
          <button class="button" id="copy">
            <span class="shadow"></span><span class="edge"></span>
            <div class="front"><span>COPIAR TEXTO FORMATADO</span></div>
          </button>
        </div>
      </div>
    </main>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script defer src="./app.js"></script>
  </body>
</html>
